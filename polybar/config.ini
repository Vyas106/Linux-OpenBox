;==========================================================
;
;   POLYBAR CONFIGURATION - MINIMAL & MODERN
;   Pure 100% Black & White Monochrome Aesthetic
;   Openbox Linux powered by CachyOS (Arch)
;
;==========================================================

[colors]
background = #000000
background-alt = #121212
background-highlight = #202020
foreground = #d4d4d4
foreground-alt = #8a8a8a
foreground-highlight = #ffffff
border-color = #1c1c1c
border-active = #555555
alert = #ff5555
good = #50fa7b
separator-color = #262626

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 30pt
radius = 0

; Position bar at top
bottom = false

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
line-color = ${colors.border-active}

border-bottom-size = 1pt
border-bottom-color = #1a1a1a

padding-left = 0
padding-right = 0

module-margin-left = 0
module-margin-right = 0

; Fonts
font-0 = "JetBrainsMono Nerd Font:style=Medium:size=9.5;3"
font-1 = "JetBrainsMono Nerd Font:style=Regular:size=9.5;3"
font-2 = "JetBrainsMono Nerd Font Mono:size=10;3"
font-3 = "Symbols Nerd Font:size=10;3"
font-4 = "JetBrainsMono Nerd Font:style=Regular:size=8;2"
; Larger font (+2-3px) for pinned application icons
font-5 = "JetBrainsMono Nerd Font:style=Regular:size=12;3"
font-6 = "Symbols Nerd Font:size=12;3"

; Modules arrangement
modules-left = launcher sep pin-term pin-browser pin-files pin-editor pin-obsidian pin-ai sep xworkspaces sep minimize-all sep-small close-all
modules-center =
modules-right = sys-info sep wifi sep net sep tools sep pulseaudio sep battery sep date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
override-redirect = false

;----------------------------------------------------------
; SEPARATORS
;----------------------------------------------------------
[module/sep]
type = custom/text
format = " │ "
format-foreground = ${colors.separator-color}

[module/sep-small]
type = custom/text
format = " "

;----------------------------------------------------------
; APP LAUNCHER
;----------------------------------------------------------
[module/launcher]
type = custom/text
format = " 󰣇  App "
format-foreground = #ffffff
format-background = #1e3a8a
format-padding = 0
click-left = rofi -show drun -theme ~/.config/rofi/launcher.rasi

;----------------------------------------------------------
; PINNED APPLICATIONS (6 Apps - Scaled +2-3px)
;----------------------------------------------------------
[module/pin-term]
type = custom/text
format = " %{T6}%{T-} "
format-foreground = ${colors.foreground}
format-background = ${colors.background}
click-left = kitty &

[module/pin-browser]
type = custom/text
format = " %{T6}󰈹%{T-} "
format-foreground = ${colors.foreground}
format-background = ${colors.background}
click-left = firefox &

[module/pin-files]
type = custom/text
format = " %{T6}%{T-} "
format-foreground = ${colors.foreground}
format-background = ${colors.background}
click-left = dolphin &

[module/pin-editor]
type = custom/text
format = " %{T6}󰨞%{T-} "
format-foreground = ${colors.foreground}
format-background = ${colors.background}
click-left = "/home/vishal/Downloads/Antigravity IDE/antigravity-ide" &

[module/pin-obsidian]
type = custom/text
format = " %{T6}󱞁%{T-} "
format-foreground = ${colors.foreground}
format-background = ${colors.background}
click-left = obsidian &

[module/pin-ai]
type = custom/text
format = " %{T6}󰚩%{T-} "
format-foreground = ${colors.foreground}
format-background = ${colors.background}
click-left = "/home/vishal/Useless/Desktop AI Agent/toggle_agent.sh" &

;----------------------------------------------------------
; WORKSPACES (EWMH / OPENBOX)
;----------------------------------------------------------
[module/xworkspaces]
type = internal/xworkspaces

enable-click = true
enable-scroll = true
reverse-scroll = true

icon-0 = "desktop 1;Desktop 1"
icon-1 = "desktop 2;Desktop 2"
icon-2 = "desktop 3;Desktop 3"
icon-3 = "desktop 4;Desktop 4"
icon-default = "Desktop %name%"

format = <label-state>

label-active = " %icon% "
label-active-foreground = #ffffff
label-active-background = #282828
label-active-underline = #ffffff
label-active-padding = 0

label-occupied = " %icon% "
label-occupied-foreground = #9e9e9e
label-occupied-background = #141414
label-occupied-padding = 0

label-urgent = " %icon% "
label-urgent-foreground = ${colors.alert}
label-urgent-background = #1c1c1c
label-urgent-padding = 0

label-empty = " %icon% "
label-empty-foreground = #444444
label-empty-background = ${colors.background}
label-empty-padding = 0

;----------------------------------------------------------
; DESKTOP WINDOW ACTIONS: MINIMIZE ALL & CLOSE ALL
;----------------------------------------------------------
[module/minimize-all]
type = custom/text
format = "%{A1:/home/vishal/.config/polybar/scripts/window_actions minimize:} %{T6}󰖰%{T-} Min %{A}"
format-foreground = #60a5fa
format-background = #0f172a
click-left = /home/vishal/.config/polybar/scripts/window_actions minimize

[module/close-all]
type = custom/text
format = "%{A1:/home/vishal/.config/polybar/scripts/window_actions close_all:} %{T6}󰅖%{T-} Close %{A}"
format-foreground = #f87171
format-background = #1c1917
click-left = /home/vishal/.config/polybar/scripts/window_actions close_all

;----------------------------------------------------------
; ACTIVE WINDOW TITLE
;----------------------------------------------------------
[module/xwindow]
type = internal/xwindow
format = <label>
format-foreground = #8a8a8a
label = "%title:0:45:...%"
label-empty = "Openbox Desktop"
label-empty-foreground = #3a3a3a

;----------------------------------------------------------
; RIGHT MODULE 1: INTERACTIVE EXPANDABLE SYS INFO
;----------------------------------------------------------
[module/sys-info]
type = custom/script
exec = ~/.config/polybar/scripts/sys-info.sh
interval = 1
format = <label>
format-foreground = ${colors.foreground}
format-background = ${colors.background}
click-left = ~/.config/polybar/scripts/sys-info.sh toggle

;----------------------------------------------------------
; RIGHT MODULE 2: WI-FI STATUS & TERMINAL GUI LAUNCHER
;----------------------------------------------------------
[module/wifi]
type = custom/script
exec = ~/.config/polybar/scripts/wifi-status.sh
interval = 2
format = <label>
format-foreground = ${colors.foreground}
format-background = ${colors.background}
click-left = python3 /home/vishal/Useless/wifi_manager_tui.py &

;----------------------------------------------------------
; RIGHT MODULE 3: NETWORK SPEED (DYNAMIC TIERED COLORS)
;----------------------------------------------------------
[module/net]
type = custom/script
exec = ~/.config/polybar/scripts/net-speed.sh
interval = 1
format = <label>
format-foreground = ${colors.foreground}
format-background = ${colors.background}
click-left = python3 /home/vishal/Useless/wifi_manager_tui.py &

;----------------------------------------------------------
; RIGHT MODULE 4: TOOLS & QUICK SETTINGS CONTROL CENTER
;----------------------------------------------------------
[module/tools]
type = custom/text
format = "  Tools "
format-foreground = #ffffff
format-background = #1e3a8a
click-left = python3 /home/vishal/Useless/control_center.py &

;----------------------------------------------------------
; RIGHT MODULE 5: VOLUME
;----------------------------------------------------------
[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 5

format-volume = <ramp-volume> <label-volume>
format-volume-foreground = ${colors.foreground}
format-volume-background = ${colors.background}
label-volume = "%percentage:2%%"
label-volume-foreground = ${colors.foreground}

ramp-volume-0 = "󰕿"
ramp-volume-1 = "󰖀"
ramp-volume-2 = "󰕾"

format-muted = <label-muted>
format-muted-foreground = ${colors.foreground-alt}
format-muted-background = ${colors.background}
label-muted = "󰝟 Mute"

click-right = pavucontrol &
click-left = python3 /home/vishal/Useless/control_center.py &

;----------------------------------------------------------
; RIGHT MODULE 6: BATTERY
;----------------------------------------------------------
[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
full-at = 98
low-at = 20

poll-interval = 2

format-charging = <animation-charging> <label-charging>
format-charging-foreground = #50fa7b
format-charging-background = ${colors.background}
label-charging = "%percentage%%"
label-charging-foreground = #50fa7b

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-foreground = ${colors.foreground}
format-discharging-background = ${colors.background}
label-discharging = "%percentage%%"

format-full = <label-full>
format-full-prefix = "󰁹 "
format-full-foreground = ${colors.foreground}
format-full-background = ${colors.background}
label-full = "%percentage%%"

format-low = <animation-low> <label-low>
format-low-foreground = ${colors.alert}
format-low-background = ${colors.background}
label-low = "%percentage%%!"

ramp-capacity-0 = "󰁺"
ramp-capacity-1 = "󰁼"
ramp-capacity-2 = "󰁾"
ramp-capacity-3 = "󰂀"
ramp-capacity-4 = "󰁹"

animation-charging-0 = "󰢜"
animation-charging-1 = "󰂇"
animation-charging-2 = "󰢝"
animation-charging-3 = "󰢞"
animation-charging-4 = "󰂋"
animation-charging-framerate = 750

animation-low-0 = "󰂃"
animation-low-1 = "󰁺"
animation-low-framerate = 400

;----------------------------------------------------------
; RIGHT MODULE 7: CYCLIC TIME & DATE (NO CLIPPING)
;----------------------------------------------------------
[module/date]
type = custom/script
exec = ~/.config/polybar/scripts/time-cycle.sh
interval = 1

format = <label>
format-foreground = ${colors.foreground-highlight}
format-background = ${colors.background-highlight}
format-padding = 0
label = " %output% "

click-left = ~/.config/polybar/scripts/time-cycle.sh next
click-right = ~/.config/polybar/popup-calendar.sh &

;==========================================================
; SETTINGS
;==========================================================
[settings]
screenchange-reload = true
pseudo-transparency = false
