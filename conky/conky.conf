--[[
#=============================================================================
# CONKY CONFIGURATION - MINIMAL & MODERN
# Pure 100% Black & Crisp White Monochrome Aesthetic
# Openbox Linux powered by CachyOS (Arch)
#=============================================================================
]]

conky.config = {
    -- Window Settings (Full-Height Right Sidebar Flush to Screen Edge with 0.6 Opacity)
    alignment = 'top_right',
    gap_x = 0,
    gap_y = 40,
    minimum_width = 250,
    maximum_width = 250,
    minimum_height = 1040,
    
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_colour = '000000',
    own_window_argb_visual = true,
    own_window_argb_value = 180,  -- Opacity
    own_window_class = 'Conky',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    
    -- Borders and Margins (Left border acts as sleek subtle divider)
    border_width = 1,
    border_inner_margin = 14,
    border_outer_margin = 0,
    draw_borders = true,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = false,
    
    -- Colors (Refined Soft Monochrome with Dynamic Smart Alerts)
    default_color = 'D0D0D0',
    default_shade_color = '000000',
    default_outline_color = '282828',  -- Refined subtle dark gray border (not too bright)
    color1 = 'D4D4D4',  -- Soft Light White
    color2 = '808080',  -- Neutral Gray Labels
    color3 = '202020',  -- Subtle Dividers
    color4 = 'A0A0A0',  -- Muted Light Gray
    color5 = '50FA7B',  -- Green (Charging / Optimal Health)
    color6 = 'FF5555',  -- Red (Overload Alert / Low Battery / High Temp)
    
    -- Fonts and Formatting
    use_xft = true,
    font = 'JetBrainsMono Nerd Font:size=9:style=Regular',
    xftalpha = 1.0,
    override_utf8_locale = true,
    uppercase = false,
    use_spacer = 'none',
    
    -- Output targets
    out_to_console = false,
    out_to_x = true,
    out_to_wayland = false,
    
    -- Update intervals
    total_run_times = 0,
    update_interval = 1.5,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    double_buffer = true,
    no_buffers = true,
    text_buffer_size = 2048,
}

conky.text = [[
${color1}${font JetBrains Mono:style=Medium:size=10}SYSTEM OVERVIEW${font}${alignr}${color2}${time %H:%M}
${color3}${hr 1}
${color2}OS:${alignr}${color1}CachyOS
${color2}Kernel:${alignr}${color1}${kernel}
${color2}Uptime:${alignr}${color1}${uptime_short}
${color2}Local IP:${alignr}${color1}${exec ip route get 1.1.1.1 2>/dev/null | awk '{print $7}' || echo "Offline"}
${if_existing /sys/class/power_supply/BAT1/status}${if_match "${exec cat /sys/class/power_supply/BAT1/status 2>/dev/null}" == "Charging"}${color5}󰂄 Power:${alignr}${color5}Charging (${battery_percent BAT1}%)${else}${if_match ${battery_percent BAT1} < 20}${color6}󰂃 Power:${alignr}${color6}Low (${battery_percent BAT1}%)${else}${color2}Power:${alignr}${color1}Battery (${battery_percent BAT1}%)${endif}${endif}${endif}

${color1}${font JetBrains Mono:style=Medium:size=9.5}HARDWARE & STATS${font}
${color3}${hr 1}
${color2}CPU Usage:${alignr}${if_match ${cpu cpu0} > 80}${color6}${cpu cpu0}% 󰀦${else}${color1}${cpu cpu0}%${endif}
${if_match ${cpu cpu0} > 80}${color6}${else}${color1}${endif}${cpubar cpu0 3,222}
${color2}RAM Usage:${alignr}${if_match ${memperc} > 80}${color6}${mem} (${memperc}% 󰀦)${else}${color1}${mem} (${memperc}%)${endif}
${if_match ${memperc} > 80}${color6}${else}${color1}${endif}${membar 3,222}
${color2}SWAP Usage:${alignr}${if_match ${swapperc} > 80}${color6}${swap} (${swapperc}% 󰀦)${else}${color1}${swap} (${swapperc}%)${endif}
${if_match ${swapperc} > 80}${color6}${else}${color1}${endif}${swapbar 3,222}
${color2}Root (/):${alignr}${if_match ${fs_used_perc /} > 85}${color6}${fs_used /} (${fs_used_perc /}% 󰀦)${else}${color1}${fs_used /} (${fs_used_perc /}%)${endif}
${if_match ${fs_used_perc /} > 85}${color6}${else}${color1}${endif}${fs_bar 3,222 /}
${color2}Network:${alignr}${color1}${if_existing /sys/class/net/wlan0/operstate}󰖩 ${downspeed wlan0}/s ⇣ ${upspeed wlan0}/s ⇡${else}󰛳 ${gw_iface}${endif}

${color1}${font JetBrains Mono:style=Medium:size=9.5}TOP PROCESSES${font}
${color3}${hr 1}
${color2}NAME${goto 125}CPU%${alignr}MEM%
${if_match ${top cpu 1} > 50}${color6}${else}${color1}${endif}${top name 1}${goto 125}${top cpu 1}%${alignr}${top mem 1}%
${color4}${top name 2}${goto 125}${top cpu 2}%${alignr}${top mem 2}%
${color4}${top name 3}${goto 125}${top cpu 3}%${alignr}${top mem 3}%
${color2}${top name 4}${goto 125}${top cpu 4}%${alignr}${top mem 4}%

${color1}${font JetBrains Mono:style=Medium:size=9.5}LAST USED / ACTIVE${font}
${color3}${hr 1}
${color1}${execp bash /home/vishal/.config/conky/active_apps.sh}

${color1}${font JetBrains Mono:style=Medium:size=9.5}MOST USED APPS${font}
${color3}${hr 1}
${color4}󰈹  Firefox${alignr}${color2}Web Browser
${color4}  Alacritty${alignr}${color2}Terminal
${color4}  Thunar${alignr}${color2}Files
${color4}󰨞  Code / IDE${alignr}${color2}Editor
${color4}󰚩  AI Agent${alignr}${color2}Assistant
]]
