#################################
#             Shadows           #
#################################
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.6;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@"
];

#################################
#           Fading              #
#################################
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 5;

#################################
#   Transparency / Opacity      #
#################################
inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
active-opacity = 1.0;

# Menu opacity: 0.85 (85% translucent black)
menu-opacity = 0.85;

opacity-rule = [
  "85:window_type = 'menu'",
  "85:window_type = 'dropdown_menu'",
  "85:window_type = 'popup_menu'",
  "85:class_g = 'Openbox'",
  "85:class_i = 'openbox'",
  "85:_NET_WM_WINDOW_TYPE *= 'MENU'"
];

#################################
#     Background-Blurring       #
#################################
blur-background = false;

#################################
#       General Settings        #
#################################
backend = "glx";
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
log-level = "warn";

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.85; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.85; fade = true; shadow = true; };
  dropdown_menu = { opacity = 0.85; fade = true; shadow = true; };
  menu = { opacity = 0.85; fade = true; shadow = true; };
};
